name: Weekly Data Collection

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect articles
        run: python collector.py

      - name: Analyze articles
        run: python analyzer.py

      - name: Calculate trends
        run: python trend_engine.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/articles.csv data/analyzed_articles.csv data/trends.csv

          if git diff --cached --quiet; then
            echo "No new data to save."
          else
            git commit -m "Update communication monitor data"
            git push
          fi
